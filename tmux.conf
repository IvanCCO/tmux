unbind r
bind r source-file ~/.tmux.conf


set -g prefix C-s 
set -g mouse on

bind-key h select-pane -L
bind-key j select-pane -D
bind-key K select-pane -U
bind-key l select-pane -R

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'noscript/tmux-mighty-scroll' 
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'thewtex/tmux-mem-cpu-load'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'


set -g default-terminal "tmux-256color"

# Configure the catppuccin plugin
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"

# Load catppuccin
run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux
# For TPM, instead use `run ~/.tmux/plugins/tmux/catppuccin.tmux`

# Make the status line pretty and add some modules
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right '#[fg=#cdd6f4]#(ps -p #{pane_pid} -o etime= | tr -d " ") '

# Per-session context on the left; Catppuccin's system modules stay on the right.
set -g status-interval 1
set -g status-format[0] "#[align=left] #(~/.tmux/scripts/status-context.sh '#{session_id}' '#{client_prefix}')#[align=right]#{E:status-right}"

bind-key f display-popup -E "~/.tmux/scripts/session-switcher.sh"

# Break reminder for every tmux session; reloading the config does not start duplicates.
run-shell -b '~/.tmux/scripts/break-reminder.sh'

bind C-s switch-client -n
bind-key 1 run-shell '~/.tmux/scripts/switch-session-by-number.sh 1'
bind-key 2 run-shell '~/.tmux/scripts/switch-session-by-number.sh 2'
bind-key 3 run-shell '~/.tmux/scripts/switch-session-by-number.sh 3'
bind-key 4 run-shell '~/.tmux/scripts/switch-session-by-number.sh 4'
bind-key 5 run-shell '~/.tmux/scripts/switch-session-by-number.sh 5'
bind-key 6 run-shell '~/.tmux/scripts/switch-session-by-number.sh 6'
bind-key 7 run-shell '~/.tmux/scripts/switch-session-by-number.sh 7'
bind-key 8 run-shell '~/.tmux/scripts/switch-session-by-number.sh 8'
bind-key 9 run-shell '~/.tmux/scripts/switch-session-by-number.sh 9'
